# Koyeb Deployment Configuration
# Usage: koyeb apply -f koyeb.yaml
# Or connect GitHub repo in Koyeb Dashboard → it will auto-detect

version: 1
services:
  - name: maintenance-app
    type: web
    docker:
      dockerfile: backend/maintenance_module/Dockerfile
      context: backend/maintenance_module
    ports:
      - port: 8080
        protocol: http
    env:
      - name: DATABASE_URL
        value: ${DATABASE_URL}
      - name: REDIS_URL
        value: ${REDIS_URL}
      - name: BOT_TOKEN
        value: ${BOT_TOKEN}
      - name: BOT_USE_POLLING
        value: "true"
      - name: BOT_PROXY
        value: ${BOT_PROXY}
      - name: S3_ENDPOINT_URL
        value: ${S3_ENDPOINT_URL}
      - name: S3_ACCESS_KEY
        value: ${S3_ACCESS_KEY}
      - name: S3_SECRET_KEY
        value: ${S3_SECRET_KEY}
      - name: S3_BUCKET_NAME
        value: ${S3_BUCKET_NAME}
      - name: S3_REGION
        value: ${S3_REGION}
      - name: SECRET_KEY
        value: ${SECRET_KEY}
      - name: ADMIN_API_KEY
        value: ${ADMIN_API_KEY}
      - name: CORS_ORIGINS
        value: ${CORS_ORIGINS}
      - name: SCHEDULER_TIMEZONE
        value: ${SCHEDULER_TIMEZONE}
      - name: LOG_LEVEL
        value: ${LOG_LEVEL}
      - name: APP_NAME
        value: "Vending Machine Service Control"
      - name: DEBUG
        value: "false"
    healthcheck:
      path: /health
      port: 8080
      interval: 30
      timeout: 10
      threshold: 3
    scaling:
      min: 1
      max: 1
    instance:
      type: free
      region: fra

# -------------------------------------------------------
# Frontend — настраивается в Koyeb Dashboard как Static Site
# -------------------------------------------------------
# Pages → Connect GitHub → Build: npm run build, Output: dist
# Env: VITE_API_URL=https://maintenance-app.${KOYEB_APP_NAME}.koyeb.app
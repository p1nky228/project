version: '3.8'

# Production-like docker-compose for local testing
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  backend:
    build:
      context: ./backend/maintenance_module
      dockerfile: Dockerfile
    container_name: vending_backend_prod
    env_file:
      - .env.production
    environment:
      # Override for local container networking
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USE_POLLING=${BOT_USE_POLLING}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE}
      - LOG_LEVEL=${LOG_LEVEL}
    ports:
      - "8000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Override entrypoint: run only FastAPI (migrations run in start.sh but we run separately)
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"]

  bot:
    build:
      context: ./backend/maintenance_module
      dockerfile: Dockerfile
    container_name: vending_bot_prod
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USE_POLLING=${BOT_USE_POLLING}
    # Override entrypoint: run only bot
    entrypoint: ["python", "-m", "app.bot.runner", "--polling"]
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vending_frontend_prod
    env_file:
      - ./frontend/.env.production
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

networks:
  default:
    name: vending_prod_network
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vending_db
    environment:
      POSTGRES_USER: vending_user
      POSTGRES_PASSWORD: vending_pass
      POSTGRES_DB: vending
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vending_user -d vending"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vending_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.60
    container_name: vending_seaweedfs
    command: server -s3.port=9000 -master.port=9333 -volume.port=8080 -filer.port=8888 -dir=/data
    ports:
      - "9000:9000"
      - "9333:9333"
      - "8888:8888"
      - "8080:8080"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend/maintenance_module
      dockerfile: Dockerfile
    container_name: vending_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://vending_user:vending_pass@db:5432/vending
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://seaweedfs:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=vending-photos
      - S3_REGION=us-east-1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./backend/maintenance_module:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vending_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  bot:
    build:
      context: ./backend/maintenance_module
      dockerfile: Dockerfile
    container_name: vending_bot
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://vending_user:vending_pass@db:5432/vending
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://seaweedfs:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=vending-photos
      - S3_REGION=us-east-1
      - BOT_USE_POLLING=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./backend/maintenance_module:/app
    command: python -m app.bot.runner --polling

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data: